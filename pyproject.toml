[project]
name = "koda-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
]

[tool.pdm]
resolution-locks = true
distribution = false

[tool.pdm.workspace]
members = [
    "packages/*",
    "apps/*"
]

[tool.bumpver]
current_version = "0.1.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit = false
tag = false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
"packages/koda/pyproject.toml" = [
    'version = "{version}"',
]
"packages/koda/src/koda/__init__.py" = [
    '__version__ = "{version}"',
]
"apps/koda-api/f/koda/*.py" = [
    '"koda @ git+https://github.com/aurumorinc/koda.git@{version}#subdirectory=packages/koda",',
]
"apps/koda-api/f/koda/*/*.py" = [
    '"koda @ git+https://github.com/aurumorinc/koda.git@{version}#subdirectory=packages/koda",',
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "mkinit>=1.2.0",
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
    "vcrpy>=8.2.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "pytest-vcr>=1.0.2",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
