[project]
name = "koda-workspace"
version = "26.6.3"
requires-python = ">=3.9"
dependencies = [
    "camoufox>=0.4.11",
    "httpx>=0.28.1",
]

[tool.pdm]
resolution-locks = true
distribution = false

[tool.pdm.workspace]
members = [
    "packages/*",
    "apps/*"
]

[tool.bumpver]
<<<<<<< ours
current_version = "26.06.0"
||||||| ancestor
current_version = "26.6.2"
=======
current_version = "26.6.3"
>>>>>>> theirs
version_pattern = "YY.MM.INC0"
commit = false
tag = false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
"packages/koda/pyproject.toml" = [
    'version = "{version}"',
]
"packages/koda/src/koda/__init__.py" = [
    '__version__ = "{version}"',
]

[tool.pdm.build]
excludes = ["third_party/**"]

[tool.ruff]
exclude = ["third_party"]

[tool.mypy]
exclude = ["^third_party/"]

[tool.pytest.ini_options]
norecursedirs = ["third_party"]

[dependency-groups]
dev = [
    "ruff>=0.15.17",
    "mypy",
    "mkinit>=1.2.0",
]
