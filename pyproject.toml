[project]
name = "koda-workspace"
version = "26.6.38"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.28.1",
]

[tool.pdm]
resolution-locks = true
distribution = false

[tool.pdm.workspace]
members = [
    "packages/*",
    "apps/*"
]

[tool.bumpver]
current_version = "26.6.38"
version_pattern = "YY.MM.INC0"
commit = false
tag = false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
"packages/koda/pyproject.toml" = [
    'version = "{version}"',
]
"packages/koda/src/koda/__init__.py" = [
    '__version__ = "{version}"',
]
"apps/koda-api/f/koda/*.py" = [
    '"koda @ git+https://github.com/aurumorinc/koda.git@{version}#subdirectory=packages/koda",',
]
"apps/koda-api/f/koda/*/*.py" = [
    '"koda @ git+https://github.com/aurumorinc/koda.git@{version}#subdirectory=packages/koda",',
]

[dependency-groups]
dev = [
    "ruff>=0.15.17",
    "mypy",
    "mkinit>=1.2.0",
]
