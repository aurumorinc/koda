[project]
name = "koda"
version = "0.14.0"
description = "Koda - The Firecrawl Alternative"
authors = [{name = "Aryan Singh", email = "aryan.singh@aurumor.com"}]
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.42.0",
    "Pillow>=10.2.0",
    "pyotp>=2.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "worldline @ git+https://github.com/aurumorinc/worldline-python.git",
    "oort-python @ git+https://github.com/aurumorinc/oort-python.git",
    "invisible-playwright @ git+https://github.com/feder-cr/invisible_playwright.git",
    "crawl4ai",
    "httpx>=0.28.1",
    "upstash-redis>=1.7.0",
    "aioimaplib>=2.0.1",
    "crawlee>=1.7.3",
    "requests-file>=3.0.1",
    "stagehand>=3.21.0",
    "browserforge>=1.2.4",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project.scripts]
pytest = "koda.infrastructure.pytest:main"

[dependency-groups]
dev = [
    "mkinit>=1.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyrefly>=1.1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
norecursedirs = ["tests/manual"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
