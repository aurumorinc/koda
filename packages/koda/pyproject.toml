[project]
name = "koda"
version = "26.6.7"
description = "Koda - The Firecrawl Alternative"
authors = [{name = "Aurumor", email = "koda@example.com"}]
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.42.0",
    "Pillow>=10.2.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "pyotp>=2.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-logging @ git+https://github.com/aurumorinc/python-logging.git",
    "invisible-playwright @ git+https://github.com/feder-cr/invisible_playwright.git",
    "crawl4ai",
    "httpx>=0.28.1",
    "upstash-redis>=1.7.0",
    "aioimaplib>=2.0.1",
    "camoufox>=0.4.11",
    "sentry-sdk>=2.61.0",
    "aioboto3>=13.0.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project.scripts]
pytest = "koda.infrastructure.pytest:main"

[dependency-groups]
dev = [
    "mkinit>=1.2.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.pdm.build]
excludes = ["third_party/**"]

